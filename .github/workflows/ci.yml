name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - name: Cache cargo registry and target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - run: cargo build --locked --all-targets
      - run: cargo test --locked

  metadata:
    name: Validate desktop and AppStream metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - run: appstreamcli validate --no-net data/io.github.danst0.passwordgenerator.metainfo.xml
      - run: desktop-file-validate data/io.github.danst0.passwordgenerator.desktop
